<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--wall:#1f2d28;--gold:#b89a4a;--paper:#efe9da;--ink:#27231e;--font:'Newsreader',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--wall);color:#eee8d8;font:400 1.125rem/1.5 var(--font);text-align:center;padding:clamp(40px,8vw,88px) 20px 56px}
h1{font-weight:400;font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.08;letter-spacing:-.01em;margin:0 auto 1.8rem;max-width:16em;text-wrap:balance}
.btn{position:relative;display:inline-block;padding:.8rem 1.7rem;border:1px solid var(--gold);background:var(--gold);color:#1c170c;font:500 1rem var(--font);letter-spacing:.02em;border-radius:2px;cursor:pointer}
.btn:hover{background:#c9ad5e}
.btn:focus-within,.link:focus-visible{outline:2px solid #eee8d8;outline-offset:3px}
.btn input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.note{margin:1rem 0 0;font-size:.9rem;opacity:.55}
#msg{min-height:1.5rem;margin:2rem 0 1.2rem;font-style:italic;opacity:.85}
.pair{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;max-width:860px;margin:0 auto}
.slot{flex:1 1 260px;max-width:360px}
.frame{position:relative;overflow:hidden;aspect-ratio:3/4;border:10px solid var(--gold);background:#0f1512;box-shadow:0 14px 30px #0007}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame.art img{object-fit:contain}
.plaque{margin-top:14px;padding:.7rem .9rem;background:var(--paper);color:var(--ink);text-align:left;line-height:1.3}
.plaque b{display:block;font-weight:500;font-size:1.1rem}
.plaque span{display:block;font-size:.9rem;opacity:.75}
.plaque a{font-size:.85rem}
.more h2{margin:2.6rem 0 1rem;font:italic 400 1.25rem var(--font);opacity:.85}
.row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.more .slot{flex:0 1 200px}.more .frame{border-width:6px}.more .plaque b{font-size:1rem}
.scan:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--gold);animation:s 1.5s ease-in-out infinite alternate}
@keyframes s{from{top:0}to{top:100%}}
.in{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.scan:after{animation:none;top:50%}.in{animation:none}}
.link{margin-top:2.4rem;padding:0;border:0;background:none;color:inherit;font:italic 1rem var(--font);text-decoration:underline;opacity:.7;cursor:pointer}
.credit{margin-top:3rem;font-size:.8rem;opacity:.4}
a{color:inherit}
</style></head><body>
<h1>Which painting do you look like?</h1>
<label class="btn">Choose a photo<input id="f" type="file" accept="image/*"></label>
<p class="note">Photos are not stored.</p>
<div id="msg" role="status"></div><div id="out"></div>
<div class="credit">Paintings: The Met Open Access</div>
<script>
const $=id=>document.getElementById(id);
const pic=(src,alt)=>{const i=new Image();i.src=src;i.alt=alt;return i};
function slot(img,cls,title,sub,url){
 const s=document.createElement('div');s.className='slot';
 const f=document.createElement('div');f.className='frame '+cls;f.append(img);
 const p=document.createElement('div');p.className='plaque';
 const t=document.createElement('b');t.textContent=title;p.append(t);
 if(sub){const m=document.createElement('span');m.textContent=sub;p.append(m)}
 if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='View at The Met';p.append(a)}
 s.append(f,p);return s}
const art=m=>slot(pic(m.image,m.title),'art',m.title,(m.artist||'Unknown artist')+(m.date?', '+m.date:''),m.url);
async function post(body){
 const r=await fetch(location.href,{method:'POST',body:JSON.stringify(body)});
 if(r.status===429||r.status===503)return{error:'The gallery is busy. Try again in a few seconds.'};
 return await r.json().catch(()=>({error:'Unexpected reply from the server.'}))}
async function run(file){
 $('out').innerHTML='';$('msg').textContent='Searching...';
 const pair=document.createElement('div');pair.className='pair in';
 const you=slot(pic(URL.createObjectURL(file),'Your photo'),'you','You');
 const yf=you.querySelector('.frame');yf.classList.add('scan');pair.append(you);$('out').append(pair);
 pair.scrollIntoView({behavior:'smooth',block:'center'});
 try{
  const im=await createImageBitmap(file);const k=Math.min(1,800/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const d=await post({image:c.toDataURL('image/jpeg',.85)});yf.classList.remove('scan');
  if(d.error){$('msg').textContent=d.error;return}
  if(!d.matches||!d.matches.length){$('msg').textContent='No match found. Try another photo.';return}
  const [m,...rest]=d.matches;$('msg').textContent='';pair.append(art(m));
  if(rest.length){const more=document.createElement('div');more.className='more in';more.innerHTML='<h2>Also close</h2>';
   const row=document.createElement('div');row.className='row';rest.forEach(x=>row.append(art(x)));more.append(row);$('out').append(more)}
  const again=document.createElement('button');again.type='button';again.className='link';again.textContent='Try another photo';
  again.onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('f').click()};$('out').append(again);
 }catch(e){yf.classList.remove('scan');$('msg').textContent='Something went wrong. Check your connection and try again.'}
}
$('f').onchange=e=>{const f=e.target.files[0];if(f){run(f);e.target.value=''}};
</script></body></html>
